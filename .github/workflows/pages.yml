# Publishes the static project page in site/ to GitHub Pages.
# It reuses the app's stylesheet, fonts and theme script from src/main/webapp/assets.
# Runs only when started by hand: Actions > Publish project page > Run workflow.
name: Publish project page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the page
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp -r src/main/webapp/assets/css src/main/webapp/assets/js _site/assets/
          if [ -d src/main/webapp/assets/fonts ]; then cp -r src/main/webapp/assets/fonts _site/assets/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
