# Runs ResumeMatch (Tomcat 9) and MySQL 8 together.
#   docker compose up --build        then open http://localhost:8080/ResumeMatch/
# On first start MySQL runs database/01_schema.sql and 02_seed_data.sql.
# Copy .env.example to .env and change the passwords before putting this online.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: resumematch
      MYSQL_USER: ${DB_USER:-resumematch}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RESUMEMATCH_DB_URL: jdbc:mysql://db:3306/resumematch?useSSL=false&allowPublicKeyRetrieval=true
      RESUMEMATCH_DB_USER: ${DB_USER:-resumematch}
      RESUMEMATCH_DB_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - resumes:/usr/local/tomcat/resumes

volumes:
  db-data:
  resumes:
